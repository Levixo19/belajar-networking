r4
# This file describes the network interfaces
auto lo
iface lo inet loopback

auto eth1
iface eth1

auto eth2
iface eth2

auto eth3
iface eth3

# ports.conf --
frr version 10.7.1
frr defaults traditional
hostname r4
log stdout
service integrated-vtysh-config
!
! Dihasilkan oleh scripts/render.py dari source of truth. JANGAN diedit manual:
! perubahan manual akan terdeteksi sebagai drift dan ditimpa pada deploy berikutnya.
!
interface lo
 ip address 10.255.0.4/32
 ip ospf area 0
!
interface eth1
 description ke r1 eth3
 ip address 10.0.0.5/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
 description ke r2 eth3
 ip address 10.0.0.9/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 20
!
interface eth3
 description ke sw2 ethernet-1/1
 ip address 10.20.20.1/24
!
router ospf
 ospf router-id 10.255.0.4
 log-adjacency-changes
 redistribute connected route-map RM-CONNECTED-KE-OSPF
!
ip prefix-list PL-LAN seq 10 permit 10.20.20.0/24
!
route-map RM-CONNECTED-KE-OSPF permit 10
 match ip address prefix-list PL-LAN
!
