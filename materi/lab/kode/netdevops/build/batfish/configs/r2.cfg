r2
# This file describes the network interfaces
auto lo
iface lo inet loopback

auto eth1
iface eth1

auto eth2
iface eth2

auto eth3
iface eth3

# ports.conf --
frr version 10.7.1
frr defaults traditional
hostname r2
log stdout
service integrated-vtysh-config
!
! Dihasilkan oleh scripts/render.py dari source of truth. JANGAN diedit manual:
! perubahan manual akan terdeteksi sebagai drift dan ditimpa pada deploy berikutnya.
!
interface lo
 ip address 10.255.0.2/32
 ip ospf area 0
!
interface eth1
 description ke r1 eth1
 ip address 10.0.0.1/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
 description ke r3 eth2
 ip address 10.0.0.6/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 20
!
interface eth3
 description ke r4 eth2
 ip address 10.0.0.8/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 20
!
router ospf
 ospf router-id 10.255.0.2
 log-adjacency-changes
!
