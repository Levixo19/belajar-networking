# Provisioning dashboard dari berkas: dashboard ikut versi di Git (observability sebagai kode).
---
apiVersion: 1

providers:
  - name: netdevops
    type: file
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
