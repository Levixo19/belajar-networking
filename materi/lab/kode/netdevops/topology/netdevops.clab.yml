#
# Lab 08 NetDevOps dari Nol: "jaringan produksi" mini PT contoh di DC Jakarta.
#
#          r1 ------------ r2        inti (FRR, OSPF area 0)
#          |  \          /  |
#          |    \      /    |        biaya OSPF: link ke r1 = 10, link ke r2 = 20
#          |      \  /      |
#          |      /  \      |
#          |    /      \    |
#          r3 /          \ r4        distribusi (FRR); r3 dan r4 tidak terhubung langsung
#         /  \              |
#       sw1  noc1          sw2       akses L2 (Nokia SR Linux, mac-vrf)
#        |                  |
#        h1                srv1      host (network-multitool)
#
# Router FRR dan switch SR Linux sengaja dinyalakan TANPA konfigurasi jaringan.
# Konfigurasi datang dari NetBox -> render.py -> Batfish -> deploy.py (Nornir).
# Host memakai exec di bawah ini; alamatnya harus sama dengan sot/seed.yml.
#
# Deploy:   sudo containerlab deploy -t topology/netdevops.clab.yml
# Hapus:    sudo containerlab destroy -t topology/netdevops.clab.yml --cleanup
name: netdevops

mgmt:
  network: nd-mgmt
  ipv4-subnet: 172.30.30.0/24

topology:
  kinds:
    frr:
      image: quay.io/frrouting/frr:containerlab-10.7.1
      daemons:
        - ospfd
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:26.7.2
    linux:
      image: ghcr.io/srl-labs/network-multitool:v0.10.0

  nodes:
    # ---------------------------------------------------------------- router FRR
    r1: {kind: frr, mgmt-ipv4: 172.30.30.11, group: inti}
    r2: {kind: frr, mgmt-ipv4: 172.30.30.12, group: inti}
    r3: {kind: frr, mgmt-ipv4: 172.30.30.13, group: distribusi}
    r4: {kind: frr, mgmt-ipv4: 172.30.30.14, group: distribusi}

    # ---------------------------------------------------------------- switch SR Linux
    sw1: {kind: nokia_srlinux, mgmt-ipv4: 172.30.30.21, group: akses}
    sw2: {kind: nokia_srlinux, mgmt-ipv4: 172.30.30.22, group: akses}

    # ---------------------------------------------------------------- host
    h1:
      kind: linux
      mgmt-ipv4: 172.30.30.31
      group: host
      exec:
        - ip addr add 10.10.10.10/24 dev eth1
        - ip route replace default via 10.10.10.1 dev eth1
    noc1:
      kind: linux
      mgmt-ipv4: 172.30.30.32
      group: host
      exec:
        - ip addr add 10.99.0.10/24 dev eth1
        - ip route replace default via 10.99.0.1 dev eth1
    srv1:
      kind: linux
      # network-multitool + iptables; bangun dulu: docker build -t netdevops/srv:local images/srv
      image: netdevops/srv:local
      mgmt-ipv4: 172.30.30.33
      group: host
      exec:
        - ip addr add 10.20.20.10/24 dev eth1
        - ip route replace default via 10.20.20.1 dev eth1

    # ---------------------------------------------------------------- telemetri
    gnmic:
      kind: linux
      image: ghcr.io/openconfig/gnmic:0.49.0
      mgmt-ipv4: 172.30.30.41
      group: telemetri
      binds:
        - ../telemetry/gnmic.yml:/gnmic-config.yml:ro
      cmd: --config /gnmic-config.yml --log subscribe
    snmp-exporter:
      kind: linux
      image: prom/snmp-exporter:v0.30.1
      mgmt-ipv4: 172.30.30.44
      group: telemetri
    prometheus:
      kind: linux
      image: prom/prometheus:v3.15.0
      mgmt-ipv4: 172.30.30.42
      group: telemetri
      binds:
        - ../telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      cmd: --config.file=/etc/prometheus/prometheus.yml
      ports:
        - 9090:9090
    grafana:
      kind: linux
      image: grafana/grafana:13.2.3
      mgmt-ipv4: 172.30.30.43
      group: telemetri
      binds:
        - ../telemetry/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
        - ../telemetry/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
        - ../telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
      env:
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      ports:
        - 3000:3000

  links:
    # Harus sama persis dengan bagian "links" di sot/seed.yml.
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r1:eth3", "r4:eth1"]
    - endpoints: ["r2:eth2", "r3:eth2"]
    - endpoints: ["r2:eth3", "r4:eth2"]
    - endpoints: ["r3:eth3", "sw1:e1-1"]
    - endpoints: ["sw1:e1-2", "h1:eth1"]
    - endpoints: ["r3:eth4", "noc1:eth1"]
    - endpoints: ["r4:eth3", "sw2:e1-1"]
    - endpoints: ["sw2:e1-2", "srv1:eth1"]
