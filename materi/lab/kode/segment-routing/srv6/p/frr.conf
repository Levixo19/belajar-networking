! Lab 22.3b: SRv6 (uSID, format F3216) + L3VPN IPv4 di atas inti IPv6-only
frr defaults traditional
hostname p
log stdout informational
service integrated-vtysh-config
!
router-id 10.255.255.2
!
interface lo
 ipv6 address fd00::2/128
 ipv6 router isis CORE
 isis passive
exit
!
interface eth1
 description ke-pe1
 ipv6 address fd00:12::2/64
 ipv6 router isis CORE
 isis network point-to-point
exit
!
interface eth2
 description ke-pe2
 ipv6 address fd00:23::2/64
 ipv6 router isis CORE
 isis network point-to-point
exit
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bbbb:2::/48 block-len 32 node-len 16 func-bits 16
    behavior usid
   exit
  exit
 exit
exit
!
router isis CORE
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 metric-style wide
 segment-routing srv6
  locator MAIN
 exit
exit
!
line vty
!
