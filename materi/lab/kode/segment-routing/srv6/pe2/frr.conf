! Lab 22.3b: SRv6 (uSID, format F3216) + L3VPN IPv4 di atas inti IPv6-only
frr defaults traditional
hostname pe2
log stdout informational
service integrated-vtysh-config
!
router-id 10.255.255.3
!
interface lo
 ipv6 address fd00::3/128
 ipv6 router isis CORE
 isis passive
exit
!
interface eth1
 description ke-p
 ipv6 address fd00:23::3/64
 ipv6 router isis CORE
 isis network point-to-point
exit
!
interface eth2 vrf CUST
 description ke-ce (VRF pelanggan)
 ip address 192.168.2.1/24
exit
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bbbb:3::/48 block-len 32 node-len 16 func-bits 16
    behavior usid
   exit
  exit
  encapsulation
   source-address fd00::3
  exit
 exit
exit
!
router isis CORE
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 65000
 bgp router-id 10.255.255.3
 no bgp default ipv4-unicast
 neighbor fd00::1 remote-as 65000
 neighbor fd00::1 update-source lo
 neighbor fd00::1 capability extended-nexthop
 !
 address-family ipv4 vpn
  neighbor fd00::1 activate
 exit-address-family
 !
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 65000 vrf CUST
 bgp router-id 10.255.255.3
 !
 address-family ipv4 unicast
  redistribute connected
  sid vpn export auto
  nexthop vpn export fd00::3
  rd vpn export 65000:3
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
exit
!
line vty
!
