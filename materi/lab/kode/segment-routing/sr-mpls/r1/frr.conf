! Lab 22.3: IS-IS + SR-MPLS + TI-LFA (cincin lima router)
frr defaults traditional
hostname r1
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.1/32
 ip router isis CORE
 isis passive
!
interface eth1
 description ke-r2
 ip address 10.1.12.1/24
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 isis fast-reroute ti-lfa
!
interface eth2
 description ke-r5
 ip address 10.1.15.1/24
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 isis fast-reroute ti-lfa
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 segment-routing on
 segment-routing global-block 16000 23999 local-block 15000 15999
 segment-routing node-msd 8
 segment-routing prefix 10.0.0.1/32 index 1
!
route-map WARNA-HIJAU permit 10
 set sr-te color 10
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.0.3 remote-as 65000
 neighbor 10.0.0.3 update-source lo
 !
 address-family ipv4 unicast
  neighbor 10.0.0.3 route-map WARNA-HIJAU in
 exit-address-family
exit
!
segment-routing
 traffic-eng
  segment-list LEWAT-R5-R4
   index 10 mpls label 16004
   index 20 mpls label 16003
  !
  ! Catatan: perintah 'name' di bawah policy membuat pathd FRR 10.4.1 abort
  ! saat frr.conf dimuat; beri nama lewat vtysh setelah router hidup bila perlu.
  policy color 10 endpoint 10.0.0.3
   binding-sid 1010
   candidate-path preference 100 name EKSPLISIT explicit segment-list LEWAT-R5-R4
  !
 !
!
line vty
!
