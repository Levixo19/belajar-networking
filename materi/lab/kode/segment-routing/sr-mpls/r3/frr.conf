! Lab 22.3: IS-IS + SR-MPLS + TI-LFA (cincin lima router)
frr defaults traditional
hostname r3
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.3/32
 ip router isis CORE
 isis passive
!
interface cust0
 description prefix-pelanggan-contoh (dummy, TIDAK masuk IS-IS)
 ip address 192.0.2.3/32
!
interface eth1
 description ke-r2
 ip address 10.1.23.3/24
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 isis fast-reroute ti-lfa
!
interface eth2
 description ke-r4
 ip address 10.1.34.3/24
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 isis fast-reroute ti-lfa
!
router isis CORE
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 segment-routing on
 segment-routing global-block 16000 23999 local-block 15000 15999
 segment-routing node-msd 8
 segment-routing prefix 10.0.0.3/32 index 3
!
router bgp 65000
 bgp router-id 10.0.0.3
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 update-source lo
 !
 address-family ipv4 unicast
  network 192.0.2.3/32
 exit-address-family
exit
!
line vty
!
