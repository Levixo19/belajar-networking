! Lab 22.3: IS-IS + SR-MPLS + TI-LFA (cincin lima router)
frr defaults traditional
hostname r2
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.2/32
 ip router isis CORE
 isis passive
!
interface eth1
 description ke-r1
 ip address 10.1.12.2/24
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 isis fast-reroute ti-lfa
!
interface eth2
 description ke-r3
 ip address 10.1.23.2/24
 ip router isis CORE
 isis network point-to-point
 isis metric 10
 isis fast-reroute ti-lfa
!
router isis CORE
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 segment-routing on
 segment-routing global-block 16000 23999 local-block 15000 15999
 segment-routing node-msd 8
 segment-routing prefix 10.0.0.2/32 index 2
!
line vty
!
