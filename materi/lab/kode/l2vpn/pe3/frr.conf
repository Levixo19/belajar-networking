! pe3: PE di lab L2VPN (IS-IS + LDP + VPLS berbasis LDP, RFC 4762)
frr defaults traditional
hostname pe3
log stdout informational
!
interface lo
 ip address 10.255.0.3/32
 ip router isis CORE
 isis passive
exit
!
interface eth1
 description ke-p1 (core)
 ip address 10.0.3.0/31
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2
 description attachment-circuit ke-ce (tanpa IP: port L2 pelanggan)
exit
!
router isis CORE
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
exit
!
mpls ldp
 router-id 10.255.0.3
 !
 address-family ipv4
  discovery transport-address 10.255.0.3
  !
  interface eth1
  exit
 exit-address-family
exit
!
l2vpn PELANGGAN-B type vpls
 ! satu instance VPLS = satu broadcast domain pelanggan
 mtu 1500
 member interface eth2
 !
 member pseudowire mpw1
  neighbor lsr-id 10.255.0.1
  pw-id 100
 exit
 !
 member pseudowire mpw2
  neighbor lsr-id 10.255.0.2
  pw-id 100
 exit
 !
exit
!
