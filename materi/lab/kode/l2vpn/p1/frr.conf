! p1: router P (core murni). Hanya IS-IS + LDP, tidak tahu apa pun tentang pelanggan.
frr defaults traditional
hostname p1
log stdout informational
!
interface lo
 ip address 10.255.0.10/32
 ip router isis CORE
 isis passive
exit
!
interface eth1
 description ke-pe1
 ip address 10.0.1.1/31
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2
 description ke-pe2
 ip address 10.0.2.1/31
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth3
 description ke-pe3
 ip address 10.0.3.1/31
 ip router isis CORE
 isis network point-to-point
exit
!
router isis CORE
 net 49.0001.0000.0000.0010.00
 is-type level-2-only
exit
!
mpls ldp
 router-id 10.255.0.10
 !
 address-family ipv4
  discovery transport-address 10.255.0.10
  !
  interface eth1
  exit
  !
  interface eth2
  exit
  !
  interface eth3
  exit
 exit-address-family
exit
!
