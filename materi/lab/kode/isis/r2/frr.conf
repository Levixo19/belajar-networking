frr defaults traditional
hostname r2
log stdout informational
!
! r2: router L1/L2 di area 49.0001, gerbang area ke backbone L2.
!
interface lo
 ip address 10.1.255.2/32
 ipv6 address 2001:db8:1:ff::2/128
 ip router isis INTI
 ipv6 router isis INTI
 isis passive
!
interface eth1
 ip address 10.1.12.2/29
 ipv6 address 2001:db8:1:12::2/64
 ip router isis INTI
 ipv6 router isis INTI
 isis circuit-type level-1
 isis metric 10
 isis priority 100 level-1
!
! Link langsung ke r3: kapasitas kecil (cadangan), metrik dibuat mahal.
interface eth2
 ip address 10.0.23.1/30
 ipv6 address 2001:db8:0:23::1/64
 ip router isis INTI
 ipv6 router isis INTI
 isis circuit-type level-2-only
 isis network point-to-point
 isis metric 100
 isis password md5 KunciHello23
!
interface eth3
 ip address 10.0.25.1/30
 ipv6 address 2001:db8:0:25::1/64
 ip router isis INTI
 ipv6 router isis INTI
 isis circuit-type level-2-only
 isis network point-to-point
 isis metric 10
!
! Ringkasan area 49.0001 untuk backbone L2. Lihat catatan di modul:
! isisd FRR 10.4 belum memasukkan prefiks L1 ke LSP L2 secara otomatis,
! jadi kita iklankan ringkasan lewat redistribusi rute blackhole.
ip route 10.1.0.0/16 blackhole
ipv6 route 2001:db8:1::/48 blackhole
!
router isis INTI
 net 49.0001.0000.0000.0002.00
 is-type level-1-2
 metric-style wide
 topology ipv6-unicast
 area-password md5 KunciArea1
 domain-password md5 KunciDomain
 redistribute ipv4 static level-2
 redistribute ipv6 static level-2
 log-adjacency-changes
!
end
