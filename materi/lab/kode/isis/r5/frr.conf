frr defaults traditional
hostname r5
log stdout informational
!
! r5: router inti L2-only di area 49.0000 (setara router P di backbone).
!
interface lo
 ip address 10.0.255.5/32
 ipv6 address 2001:db8:0:ff::5/128
 ip router isis INTI
 ipv6 router isis INTI
 isis passive
!
interface eth1
 ip address 10.0.25.2/30
 ipv6 address 2001:db8:0:25::2/64
 ip router isis INTI
 ipv6 router isis INTI
 isis circuit-type level-2-only
 isis network point-to-point
 isis metric 10
!
interface eth2
 ip address 10.0.35.2/30
 ipv6 address 2001:db8:0:35::2/64
 ip router isis INTI
 ipv6 router isis INTI
 isis circuit-type level-2-only
 isis network point-to-point
 isis metric 10
!
router isis INTI
 net 49.0000.0000.0000.0005.00
 is-type level-2-only
 metric-style wide
 topology ipv6-unicast
 domain-password md5 KunciDomain
 log-adjacency-changes
!
end
