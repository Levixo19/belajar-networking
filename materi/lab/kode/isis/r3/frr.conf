frr defaults traditional
hostname r3
log stdout informational
!
! r3: router L1/L2 di area 49.0002, cermin dari r2.
!
interface lo
 ip address 10.2.255.3/32
 ipv6 address 2001:db8:2:ff::3/128
 ip router isis INTI
 ipv6 router isis INTI
 isis passive
!
interface eth1
 ip address 10.0.23.2/30
 ipv6 address 2001:db8:0:23::2/64
 ip router isis INTI
 ipv6 router isis INTI
 isis circuit-type level-2-only
 isis network point-to-point
 isis metric 100
 isis password md5 KunciHello23
!
interface eth2
 ip address 10.0.35.1/30
 ipv6 address 2001:db8:0:35::1/64
 ip router isis INTI
 ipv6 router isis INTI
 isis circuit-type level-2-only
 isis network point-to-point
 isis metric 10
!
interface eth3
 ip address 10.2.34.1/30
 ipv6 address 2001:db8:2:34::1/64
 ip router isis INTI
 ipv6 router isis INTI
 isis circuit-type level-1
 isis network point-to-point
 isis metric 10
!
ip route 10.2.0.0/16 blackhole
ipv6 route 2001:db8:2::/48 blackhole
!
router isis INTI
 net 49.0002.0000.0000.0003.00
 is-type level-1-2
 metric-style wide
 topology ipv6-unicast
 area-password md5 KunciArea2
 domain-password md5 KunciDomain
 redistribute ipv4 static level-2
 redistribute ipv6 static level-2
 log-adjacency-changes
!
end
