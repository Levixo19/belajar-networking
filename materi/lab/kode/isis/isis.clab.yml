#
# Lab IS-IS dua level (modul 07-routing-lanjutan/10-isis).
#
#    Area 49.0001             Backbone L2               Area 49.0002
#
#    r1 (L1) ------ r2 (L1/L2) ---- metrik 100 ---- r3 (L1/L2) ------ r4 (L1)
#        eth1   eth1    | eth2                  eth1 |    eth3     eth1
#     (broadcast,       | eth3                  eth2 |      (p2p)
#      ada DIS)         +------- r5 (L2-only) -------+
#                          eth1  area 49.0000  eth2
#
# Jalankan:  sudo containerlab deploy -t isis.clab.yml
# Masuk CLI: docker exec -it clab-isis-r1 vtysh
# Bongkar:   sudo containerlab destroy -t isis.clab.yml --cleanup
name: isis

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.4.1
    # Container Linux tidak meneruskan paket secara default; router harus bisa.
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
  nodes:
    r1:
      binds:
        - daemons:/etc/frr/daemons
        - vtysh.conf:/etc/frr/vtysh.conf
        - r1/frr.conf:/etc/frr/frr.conf
      # Hapus default route manajemen Docker agar default route dari ATT bit
      # (router L1) benar-benar terpasang di FIB dan bisa diamati.
      exec:
        - ip route del default
    r2:
      binds:
        - daemons:/etc/frr/daemons
        - vtysh.conf:/etc/frr/vtysh.conf
        - r2/frr.conf:/etc/frr/frr.conf
    r3:
      binds:
        - daemons:/etc/frr/daemons
        - vtysh.conf:/etc/frr/vtysh.conf
        - r3/frr.conf:/etc/frr/frr.conf
    r4:
      binds:
        - daemons:/etc/frr/daemons
        - vtysh.conf:/etc/frr/vtysh.conf
        - r4/frr.conf:/etc/frr/frr.conf
      # Hapus default route manajemen Docker agar default route dari ATT bit
      # (router L1) benar-benar terpasang di FIB dan bisa diamati.
      exec:
        - ip route del default
    r5:
      binds:
        - daemons:/etc/frr/daemons
        - vtysh.conf:/etc/frr/vtysh.conf
        - r5/frr.conf:/etc/frr/frr.conf

  links:
    # MTU 1500 dipasang eksplisit agar skenario troubleshooting MTU realistis
    # (default containerlab adalah 9500).
    - endpoints: ["r1:eth1", "r2:eth1"]
      mtu: 1500
    - endpoints: ["r2:eth2", "r3:eth1"]
      mtu: 1500
    - endpoints: ["r2:eth3", "r5:eth1"]
      mtu: 1500
    - endpoints: ["r3:eth2", "r5:eth2"]
      mtu: 1500
    - endpoints: ["r3:eth3", "r4:eth1"]
      mtu: 1500
