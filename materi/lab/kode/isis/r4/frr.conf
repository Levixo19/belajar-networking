frr defaults traditional
hostname r4
log stdout informational
!
! r4: router L1 murni di area 49.0002.
!
interface lo
 ip address 10.2.255.4/32
 ipv6 address 2001:db8:2:ff::4/128
 ip router isis INTI
 ipv6 router isis INTI
 isis passive
!
interface eth1
 ip address 10.2.34.2/30
 ipv6 address 2001:db8:2:34::2/64
 ip router isis INTI
 ipv6 router isis INTI
 isis circuit-type level-1
 isis network point-to-point
 isis metric 10
!
router isis INTI
 net 49.0002.0000.0000.0004.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 area-password md5 KunciArea2
 log-adjacency-changes
!
end
