frr defaults traditional
hostname r1
log stdout informational
!
! r1: router L1 murni di area 49.0001 (setara router akses atau POP kecil).
! Tidak tahu apa pun di luar areanya; keluar area lewat default route dari ATT bit r2.
!
interface lo
 ip address 10.1.255.1/32
 ipv6 address 2001:db8:1:ff::1/128
 ip router isis INTI
 ipv6 router isis INTI
 isis passive
!
! Link ke r2 sengaja dibiarkan bertipe broadcast (default Ethernet)
! agar pemilihan DIS dan LSP pseudonode bisa diamati.
interface eth1
 ip address 10.1.12.1/29
 ipv6 address 2001:db8:1:12::1/64
 ip router isis INTI
 ipv6 router isis INTI
 isis circuit-type level-1
 isis metric 10
!
router isis INTI
 net 49.0001.0000.0000.0001.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 area-password md5 KunciArea1
 log-adjacency-changes
!
end
