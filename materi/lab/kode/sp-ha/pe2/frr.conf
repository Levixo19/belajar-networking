! pe2: PE perbatasan AS 65000, eBGP ke upstream AS 65002 (BFD + GTSM + MD5), iBGP ke RR p1
frr defaults traditional
hostname pe2
log stdout informational
log timestamp precision 3
!
bfd
 ! Profil core: 100 ms x 3 = deteksi sekitar 300 ms
 profile CORE
  detect-multiplier 3
  receive-interval 100
  transmit-interval 100
 exit
 ! Profil eBGP ke upstream: 300 ms x 3 = deteksi sekitar 900 ms
 profile EBGP
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 exit
exit
!
interface lo
 ip address 10.255.0.2/32
 ip router isis CORE
 isis passive
exit
!
interface eth1
 description ke-p1 (core)
 ip address 10.0.2.0/31
 ip router isis CORE
 isis network point-to-point
 isis bfd
 isis bfd profile CORE
exit
!
interface eth2
 description ke-upstream AS65002
 ip address 192.0.2.2/31
exit
!
router isis CORE
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 lsp-gen-interval 1
 spf-delay-ietf init-delay 50 short-delay 200 long-delay 5000 holddown 800 time-to-learn 500
exit
!
ip prefix-list INTERNET seq 10 permit 203.0.113.0/24
ip prefix-list INTERNET seq 20 permit 198.51.100.0/24
ip prefix-list MILIK-AS65000 seq 10 permit 100.64.0.0/22
!
route-map UPSTREAM-IN permit 10
 match ip address prefix-list INTERNET
exit
!
route-map UPSTREAM-OUT permit 10
 match ip address prefix-list MILIK-AS65000
exit
!
router bgp 65000
 bgp router-id 10.255.0.2
 bgp log-neighbor-changes
 bgp graceful-restart
 bgp graceful-restart preserve-fw-state
 no bgp default ipv4-unicast
 neighbor 192.0.2.3 remote-as 65002
 neighbor 192.0.2.3 description upstream-AS65002
 neighbor 192.0.2.3 password RahasiaLab22
 neighbor 192.0.2.3 ttl-security hops 1
 neighbor 192.0.2.3 bfd profile EBGP
 neighbor 10.255.0.10 remote-as 65000
 neighbor 10.255.0.10 description RR-p1
 neighbor 10.255.0.10 update-source lo
 neighbor 10.255.0.10 bfd profile CORE
 !
 address-family ipv4 unicast
  network 100.64.0.0/22
  neighbor 192.0.2.3 activate
  neighbor 192.0.2.3 route-map UPSTREAM-IN in
  neighbor 192.0.2.3 route-map UPSTREAM-OUT out
  neighbor 10.255.0.10 activate
  neighbor 10.255.0.10 next-hop-self
 exit-address-family
exit
!
ip route 100.64.0.0/22 blackhole
!
