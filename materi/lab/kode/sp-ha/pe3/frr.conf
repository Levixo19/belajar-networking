! pe3: PE tanpa upstream sendiri. Menerima dua jalur ke internet lewat RR (Add-Path) dan memakai keduanya (ECMP)
frr defaults traditional
hostname pe3
log stdout informational
log timestamp precision 3
!
bfd
 ! Profil core: 100 ms x 3 = deteksi sekitar 300 ms
 profile CORE
  detect-multiplier 3
  receive-interval 100
  transmit-interval 100
 exit
 ! Profil eBGP ke upstream: 300 ms x 3 = deteksi sekitar 900 ms
 profile EBGP
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 exit
exit
!
interface lo
 ip address 10.255.0.3/32
 ip router isis CORE
 isis passive
exit
!
interface eth1
 description ke-p1 (core)
 ip address 10.0.3.0/31
 ip router isis CORE
 isis network point-to-point
 isis bfd
 isis bfd profile CORE
exit
!
router isis CORE
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 lsp-gen-interval 1
 spf-delay-ietf init-delay 50 short-delay 200 long-delay 5000 holddown 800 time-to-learn 500
exit
!
router bgp 65000
 bgp router-id 10.255.0.3
 bgp log-neighbor-changes
 bgp graceful-restart
 bgp graceful-restart preserve-fw-state
 bgp bestpath as-path multipath-relax
 no bgp default ipv4-unicast
 neighbor 10.255.0.10 remote-as 65000
 neighbor 10.255.0.10 description RR-p1
 neighbor 10.255.0.10 update-source lo
 neighbor 10.255.0.10 bfd profile CORE
 !
 address-family ipv4 unicast
  neighbor 10.255.0.10 activate
  maximum-paths ibgp 4
 exit-address-family
exit
!
