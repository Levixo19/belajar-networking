! up1: upstream/transit AS 65001. Mengiklankan dua prefiks 'internet' tiruan
frr defaults traditional
hostname up1
log stdout informational
log timestamp precision 3
!
bfd
 ! Profil eBGP ke upstream: 300 ms x 3 = deteksi sekitar 900 ms
 profile EBGP
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 exit
exit
!
interface eth1
 description ke-AS65000
 ip address 192.0.2.1/31
exit
!
ip route 203.0.113.0/24 blackhole
ip route 198.51.100.0/24 blackhole
!
route-map TERIMA-SEMUA permit 10
exit
!
router bgp 65001
 bgp router-id 192.0.2.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 192.0.2.0 remote-as 65000
 neighbor 192.0.2.0 password RahasiaLab22
 neighbor 192.0.2.0 ttl-security hops 1
 neighbor 192.0.2.0 bfd profile EBGP
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 198.51.100.0/24
  neighbor 192.0.2.0 activate
  neighbor 192.0.2.0 route-map TERIMA-SEMUA in
  neighbor 192.0.2.0 route-map TERIMA-SEMUA out
 exit-address-family
exit
!
