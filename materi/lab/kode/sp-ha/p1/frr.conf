! p1: router P sekaligus route reflector. Add-Path ke semua client
frr defaults traditional
hostname p1
log stdout informational
log timestamp precision 3
!
bfd
 ! Profil core: 100 ms x 3 = deteksi sekitar 300 ms
 profile CORE
  detect-multiplier 3
  receive-interval 100
  transmit-interval 100
 exit
 ! Profil eBGP ke upstream: 300 ms x 3 = deteksi sekitar 900 ms
 profile EBGP
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 exit
exit
!
interface lo
 ip address 10.255.0.10/32
 ip router isis CORE
 isis passive
exit
!
interface eth1
 description ke-pe1
 ip address 10.0.1.1/31
 ip router isis CORE
 isis network point-to-point
 isis bfd
 isis bfd profile CORE
exit
!
interface eth2
 description ke-pe2
 ip address 10.0.2.1/31
 ip router isis CORE
 isis network point-to-point
 isis bfd
 isis bfd profile CORE
exit
!
interface eth3
 description ke-pe3
 ip address 10.0.3.1/31
 ip router isis CORE
 isis network point-to-point
 isis bfd
 isis bfd profile CORE
exit
!
router isis CORE
 net 49.0001.0000.0000.0010.00
 is-type level-2-only
 lsp-gen-interval 1
 spf-delay-ietf init-delay 50 short-delay 200 long-delay 5000 holddown 800 time-to-learn 500
exit
!
router bgp 65000
 bgp router-id 10.255.0.10
 bgp log-neighbor-changes
 bgp graceful-restart
 bgp graceful-restart preserve-fw-state
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.1 bfd profile CORE
 neighbor 10.255.0.2 remote-as 65000
 neighbor 10.255.0.2 update-source lo
 neighbor 10.255.0.2 bfd profile CORE
 neighbor 10.255.0.3 remote-as 65000
 neighbor 10.255.0.3 update-source lo
 neighbor 10.255.0.3 bfd profile CORE
 !
 address-family ipv4 unicast
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 route-reflector-client
  neighbor 10.255.0.1 addpath-tx-all-paths
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 route-reflector-client
  neighbor 10.255.0.2 addpath-tx-all-paths
  neighbor 10.255.0.3 activate
  neighbor 10.255.0.3 route-reflector-client
  neighbor 10.255.0.3 addpath-tx-all-paths
 exit-address-family
exit
!
