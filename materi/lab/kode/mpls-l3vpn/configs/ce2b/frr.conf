!
! ce2b: CE pelanggan B. Routing statis ke PE.
! Alamat LAN dan link SAMA PERSIS dengan pelanggan A, dan itu disengaja.
!
frr version 10.4
frr defaults traditional
hostname ce2b
service integrated-vtysh-config
!
interface eth1
 ip address 172.16.2.2/30
exit
!
interface lan0
 description LAN kantor (tiruan)
 ip address 192.168.2.1/24
exit
!
! Rute statis ke seluruh jaringan kantor pelanggan B lewat PE. Sengaja bukan
! default route: di containerlab, eth0 (manajemen) sudah membawa default route
! dari Docker, dan rute kernel itu akan menang atas default route FRR.
ip route 192.168.0.0/16 172.16.2.1
!
