! ce2a: CE pelanggan A (AS 65001, sama di kedua situs). eBGP ke PE.
!
frr version 10.4
frr defaults traditional
hostname ce2a
service integrated-vtysh-config
!
interface eth1
 ip address 172.16.2.2/30
exit
!
interface lan0
 description LAN kantor (tiruan)
 ip address 192.168.2.1/24
exit
!
route-map RM-PE-IN permit 10
exit
!
route-map RM-PE-OUT permit 10
exit
!
router bgp 65001
 bgp router-id 192.168.2.1
 neighbor 172.16.2.1 remote-as 65000
 neighbor 172.16.2.1 description PE-operator
 !
 address-family ipv4 unicast
  network 192.168.2.0/24
  neighbor 172.16.2.1 route-map RM-PE-IN in
  neighbor 172.16.2.1 route-map RM-PE-OUT out
 exit-address-family
exit
!
