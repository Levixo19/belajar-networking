! pe2: router PE. Core: IS-IS L2 + LDP. Layanan: VRF CUST-A (eBGP ke CE) dan
! VRF CUST-B (static ke CE). MP-BGP VPNv4 iBGP ke 10.255.0.1 (PE seberang).
!
frr version 10.4
frr defaults traditional
hostname pe2
service integrated-vtysh-config
!
vrf CUST-B
 ip route 192.168.2.0/24 172.16.2.2
exit-vrf
!
interface lo
 ip address 10.255.0.3/32
 ip router isis CORE
 isis passive
exit
!
interface eth1
 description core
 ip address 10.0.23.2/30
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2
 description ke-CE pelanggan A (VRF CUST-A)
 ip address 172.16.2.1/30
exit
!
interface eth3
 description ke-CE pelanggan B (VRF CUST-B)
 ip address 172.16.2.1/30
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0102.5500.0003.00
 metric-style wide
 mpls ldp-sync
exit
!
mpls ldp
 router-id 10.255.0.3
 !
 address-family ipv4
  discovery transport-address 10.255.0.3
  !
  interface eth1
  exit
 exit-address-family
exit
!
ip prefix-list PL-CE-A-IN seq 10 permit 192.168.0.0/16 le 24
!
route-map RM-CE-A-IN permit 10
 match ip address prefix-list PL-CE-A-IN
exit
!
route-map RM-CE-A-OUT permit 10
exit
!
router bgp 65000
 bgp router-id 10.255.0.3
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 description PE-seberang
 neighbor 10.255.0.1 update-source lo
 !
 address-family ipv4 vpn
  neighbor 10.255.0.1 activate
 exit-address-family
exit
!
router bgp 65000 vrf CUST-A
 bgp router-id 10.255.0.3
 neighbor 172.16.2.2 remote-as 65001
 neighbor 172.16.2.2 description CE-pelanggan-A
 !
 address-family ipv4 unicast
  neighbor 172.16.2.2 as-override
  neighbor 172.16.2.2 route-map RM-CE-A-IN in
  neighbor 172.16.2.2 route-map RM-CE-A-OUT out
  label vpn export auto
  rd vpn export 10.255.0.3:100
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 65000 vrf CUST-B
 bgp router-id 10.255.0.3
 !
 address-family ipv4 unicast
  redistribute static
  label vpn export auto
  rd vpn export 10.255.0.3:200
  rt vpn both 65000:200
  export vpn
  import vpn
 exit-address-family
exit
!
