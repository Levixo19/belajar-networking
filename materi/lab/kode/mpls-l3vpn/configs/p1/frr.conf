!
! p1: router P (core). Hanya IS-IS dan LDP. Tidak menjalankan BGP sama sekali:
! ia tidak tahu apa pun tentang rute pelanggan (BGP-free core).
!
frr version 10.4
frr defaults traditional
hostname p1
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
 ip router isis CORE
 isis passive
exit
!
interface eth1
 description ke-pe1
 ip address 10.0.12.2/30
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2
 description ke-pe2
 ip address 10.0.23.1/30
 ip router isis CORE
 isis network point-to-point
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0102.5500.0002.00
 metric-style wide
 mpls ldp-sync
exit
!
mpls ldp
 router-id 10.255.0.2
 !
 address-family ipv4
  discovery transport-address 10.255.0.2
  !
  interface eth1
  exit
  !
  interface eth2
  exit
 exit-address-family
exit
!
