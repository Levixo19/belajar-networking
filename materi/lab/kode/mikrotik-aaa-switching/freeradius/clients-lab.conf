# Tambahkan ke /etc/raddb/clients.conf (FreeRADIUS 3.x).
# Satu blok per NAS. Secret harus sama persis dengan /radius secret di RouterOS.
client nas-rtrw {
	ipaddr = 10.99.0.1
	secret = Lab-Rahasia-RADIUS-2026
	require_message_authenticator = yes
	shortname = nas-rtrw
}
