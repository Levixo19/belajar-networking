!
! ISP-A (AS64500), anggota IXP. Pemilik sah 198.18.0.0/22 (ada ROA, maxLength 22).
! Lab memakai 198.18.0.0/15 (RFC 2544) sebagai pengganti ruang publik karena
! prefix dokumentasi RFC 5737 hanya tiga /24.
! Alamat di peering LAN: 10.10.0.11/24 (eth1). Jalur ke validator: eth2.
!
frr version 10.4
frr defaults traditional
hostname isp-a
log stdout informational
service integrated-vtysh-config
!
! Prefix milik sendiri: rute blackhole agar "network" punya dasar di RIB,
! dan satu alamat di loopback untuk uji ping antar-ISP.
ip route 198.18.0.0/22 blackhole
!
interface lo
 ip address 198.18.0.1/32
exit
!
! Validator RPKI (StayRTR) lewat RTR, port 8282.
rpki
 rpki polling_period 30
 ! Coba lagi cepat: di lab, alamat eth2 baru dipasang setelah FRR hidup.
 rpki retry_interval 10
 rpki cache tcp 10.20.1.3 8282 preference 1
exit
!
ip prefix-list PFX-SENDIRI seq 10 permit 198.18.0.0/22
!
! Bogon dan prefix lebih panjang dari /24 yang tidak boleh masuk dari IXP.
! (Catatan: di produksi, bogon juga mencakup prefix dokumentasi.)
ip prefix-list TOLAK-IXP seq 10 permit 0.0.0.0/8 le 32
ip prefix-list TOLAK-IXP seq 20 permit 10.0.0.0/8 le 32
ip prefix-list TOLAK-IXP seq 30 permit 127.0.0.0/8 le 32
ip prefix-list TOLAK-IXP seq 40 permit 172.16.0.0/12 le 32
ip prefix-list TOLAK-IXP seq 50 permit 192.168.0.0/16 le 32
ip prefix-list TOLAK-IXP seq 90 permit 0.0.0.0/0 ge 25
!
! Kebijakan masuk dari route server.
! Tahap awal "logging" ala MANRS: rute INVALID masih diterima tetapi diberi
! local-preference rendah. Latihan lab: ubah "permit 10" menjadi "deny 10".
route-map RS-IN deny 5
 match ip address prefix-list TOLAK-IXP
exit
route-map RS-IN permit 10
 match rpki invalid
 set local-preference 50
exit
route-map RS-IN permit 20
 match rpki valid
 set local-preference 200
exit
route-map RS-IN permit 30
 set local-preference 150
exit
!
route-map RS-OUT permit 10
 match ip address prefix-list PFX-SENDIRI
exit
!
router bgp 64500
 bgp router-id 10.10.0.11
 bgp log-neighbor-changes
 neighbor 10.10.0.10 remote-as 64510
 neighbor 10.10.0.10 description RS-IXP-LAB
 ! Route server tidak menaruh AS64510 di AS_PATH, jadi AS pertama adalah
 ! AS anggota lain. Pemeriksaan enforce-first-as harus dimatikan untuk RS.
 no neighbor 10.10.0.10 enforce-first-as
 ! RFC 9234: kita klien route server.
 neighbor 10.10.0.10 local-role rs-client
 !
 address-family ipv4 unicast
  network 198.18.0.0/22
  neighbor 10.10.0.10 soft-reconfiguration inbound
  neighbor 10.10.0.10 route-map RS-IN in
  neighbor 10.10.0.10 route-map RS-OUT out
  neighbor 10.10.0.10 maximum-prefix 1000 90
 exit-address-family
exit
!
