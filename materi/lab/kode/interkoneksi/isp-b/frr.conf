!
! ISP-B (AS64501), anggota IXP. Alamat di peering LAN: 10.10.0.12/24 (eth1).
!   203.0.113.0/24  milik sendiri, ada ROA          -> RPKI VALID
!   192.0.2.0/24    milik sendiri, belum ada ROA    -> RPKI NOT FOUND
!   198.18.1.0/24   BUKAN milik ISP-B (milik ISP-A) -> RPKI INVALID
!                   Skenario salah ketik operator yang menjadi hijack.
!
frr version 10.4
frr defaults traditional
hostname isp-b
log stdout informational
service integrated-vtysh-config
!
ip route 203.0.113.0/24 blackhole
ip route 192.0.2.0/24 blackhole
ip route 198.18.1.0/24 blackhole
!
interface lo
 ip address 203.0.113.1/32
exit
!
ip prefix-list PFX-SENDIRI seq 10 permit 203.0.113.0/24
ip prefix-list PFX-SENDIRI seq 20 permit 192.0.2.0/24
! Kesalahan yang disengaja: prefix milik orang lain ikut lolos filter keluar.
ip prefix-list PFX-SENDIRI seq 30 permit 198.18.1.0/24
!
ip prefix-list DARI-IXP seq 10 deny 203.0.113.0/24 le 32
ip prefix-list DARI-IXP seq 20 deny 192.0.2.0/24 le 32
ip prefix-list DARI-IXP seq 90 permit 0.0.0.0/0 le 24
!
route-map RS-IN permit 10
 match ip address prefix-list DARI-IXP
exit
!
route-map RS-OUT permit 10
 match ip address prefix-list PFX-SENDIRI
exit
!
router bgp 64501
 bgp router-id 10.10.0.12
 bgp log-neighbor-changes
 neighbor 10.10.0.10 remote-as 64510
 neighbor 10.10.0.10 description RS-IXP-LAB
 no neighbor 10.10.0.10 enforce-first-as
 neighbor 10.10.0.10 local-role rs-client
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 192.0.2.0/24
  network 198.18.1.0/24
  neighbor 10.10.0.10 route-map RS-IN in
  neighbor 10.10.0.10 route-map RS-OUT out
  neighbor 10.10.0.10 maximum-prefix 1000 90
 exit-address-family
exit
!
